name: retry

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutes to keep retrying in this run before re-dispatching"
        required: false
        default: "320"

concurrency:
  group: oci-launch
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPPRESS_LABEL_WARNING: "True"
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      NAME: oci-arm-1
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli >/dev/null 2>&1 && echo "oci-cli installed"

      - name: Write OCI config
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          umask 077
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.oci/ssh.pub
          cat > ~/.oci/config <<CFG
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          CFG
          chmod 600 ~/.oci/config ~/.oci/key.pem ~/.oci/ssh.pub
          echo "config written"

      - name: Launch loop
        env:
          C: ${{ secrets.OCI_TENANCY_OCID }}
          AD: ${{ secrets.OCI_AD }}
          IMAGE: ${{ secrets.OCI_IMAGE_OCID }}
          SUBNET: ${{ secrets.OCI_SUBNET_OCID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUDGET_MIN: ${{ inputs.budget_minutes || '320' }}
          SLEEP: "180"
          SLEEP_429: "300"
        run: |
          set +e -u
          sanitize(){ sed -E 's/ocid1\.[A-Za-z0-9._:-]+/<ocid>/g; s/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g'; }
          disable_self(){ gh workflow disable retry.yml >/dev/null 2>&1 && echo "workflow disabled" || echo "could not disable workflow"; }
          ts(){ date -u '+%H:%M:%SZ'; }
          # Success alert: an issue opened by github-actions[bot] emails the repo owner (watching),
          # and the run ends red so GitHub also sends its failed-run email. No instance details.
          TITLE="oci-arm-1 생성 성공"
          notify_success(){
            if [ -n "$(gh issue list --state all --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null)" ]; then
              echo "success already notified"; return 1
            fi
            gh issue create --title "$TITLE" --body "OCI ARM 서버(oci-arm-1, 1 OCPU / 6 GB) 생성에 성공했어요. 재시도 워크플로는 자동으로 꺼졌어요. 자세한 정보는 OCI 콘솔이나 오라클_봇에게 확인하세요. (이 실행이 '실패'로 표시되는 건 알림 메일을 보내기 위한 의도된 동작이에요.)" >/dev/null 2>&1 && echo "success issue opened" || echo "could not open issue"
            echo "::error::oci-arm-1 생성 성공 (알림용으로 일부러 실패 처리)"
            return 0
          }
          case "$BUDGET_MIN" in ''|*[!0-9]*) BUDGET_MIN=320;; esac
          deadline=$(( $(date +%s) + BUDGET_MIN*60 ))
          echo "budget: ${BUDGET_MIN} min"
          n=0
          while :; do
            # Duplicate guard
            if ! oci compute instance list -c "$C" --all > list.json 2> list.err; then
              lcode=$(grep -o '"status": *[0-9]*' list.err | head -1 | grep -o '[0-9]*$')
              echo "$(ts) RESULT: instance list failed status=${lcode:-?}"
              if [ "${lcode:-}" = 429 ] || [[ "${lcode:-}" =~ ^5[0-9][0-9]$ ]]; then
                w=$SLEEP_429
              else
                tail -3 list.err | sanitize | head -c 400; echo
                exit 1
              fi
            else
              live=$(jq -r --arg n "$NAME" '[.data[]? | select(.["lifecycle-state"] != "TERMINATED" and .["lifecycle-state"] != "TERMINATING" and (.["display-name"] == $n or .shape == "VM.Standard.A1.Flex"))] | length' list.json)
              if [ "${live:-0}" -gt 0 ]; then
                echo "$(ts) RESULT: instance already exists, skipping launch"
                disable_self
                if notify_success; then exit 1; fi
                exit 0
              fi
              n=$((n+1))
              oci compute instance launch -c "$C" --availability-domain "$AD" --display-name "$NAME" \
                --shape VM.Standard.A1.Flex --shape-config '{"ocpus":1,"memoryInGBs":6}' \
                --image-id "$IMAGE" --subnet-id "$SUBNET" --assign-public-ip true \
                --ssh-authorized-keys-file ~/.oci/ssh.pub --no-retry > out.txt 2>&1
              rc=$?
              if [ $rc -eq 0 ]; then
                echo "$(ts) RESULT: attempt #$n SUCCESS - instance launched (details hidden; check from the OCI console/CLI)"
                disable_self
                notify_success
                exit 1
              fi
              code=$(grep -o '"code": *"[^"]*"' out.txt | head -1 | sed 's/.*: *"//;s/"$//')
              status=$(grep -o '"status": *[0-9]*' out.txt | head -1 | grep -o '[0-9]*$')
              msg=$(grep -o '"message": *"[^"]*"' out.txt | head -1 | sed 's/.*: *"//;s/"$//' | sanitize)
              echo "$(ts) RESULT: attempt #$n rc=$rc code=${code:-?} status=${status:-?} msg=${msg:-?}"
              if [ "${status:-}" = 429 ] || [ "${code:-}" = TooManyRequests ]; then
                w=$SLEEP_429
              elif echo "${msg:-}" | grep -qi 'capacity' || [ "${code:-}" = InternalError ] || [[ "${status:-}" =~ ^5[0-9][0-9]$ ]]; then
                w=$SLEEP
              else
                echo "unexpected error; stopping without re-dispatch"
                tail -5 out.txt | sanitize | head -c 600; echo
                exit 1
              fi
            fi
            if [ $(( $(date +%s) + w )) -ge $deadline ]; then break; fi
            sleep "$w"
          done
          echo "$(ts) budget used after $n attempts; re-dispatching"
          for i in 1 2 3; do
            if gh workflow run retry.yml --ref main >/dev/null 2>&1; then echo "re-dispatched"; exit 0; fi
            sleep 10
          done
          echo "re-dispatch failed (cron backup remains)"
          exit 0

      - name: Cleanup
        if: always()
        run: rm -rf ~/.oci out.txt list.json list.err
